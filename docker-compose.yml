# Local dev only: WordPress + MariaDB with this theme mounted. See README.
name: artvibes-dev
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["127.0.0.1:8088:80"]
    environment: &wpenv
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes: &wpvol
      - wpdata:/var/www/html
      - "${THEME_DIR:-.}:/var/www/html/wp-content/themes/artvibes"
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on: [wordpress]
    environment: *wpenv
    volumes: *wpvol
volumes:
  wpdata:
